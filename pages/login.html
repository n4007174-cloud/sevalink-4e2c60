<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SevaLink</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo"><span class="logo-icon">🔗</span><span>SevaLink</span></a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <!-- Login Form -->
      <div id="loginView">
        <h2>Welcome Back 👋</h2>
        <p class="auth-sub">Login to track orders and book services.</p>
        <div id="loginAlert"></div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="loginPhone" placeholder="+91 9XXXXXXXXX"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter your password"/>
        </div>
        <button class="btn-primary btn-full" onclick="handleLogin()">Login →</button>
        <p class="auth-switch">New to SevaLink? <a href="#" onclick="switchView('register')">Create Account</a></p>
      </div>

      <!-- Register Form -->
      <div id="registerView" style="display:none;">
        <h2>Create Account 🙌</h2>
        <p class="auth-sub">Join SevaLink and access government services easily.</p>
        <div id="regAlert"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Your full name"/>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" id="regPhone" placeholder="+91 9XXXXXXXXX"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Create a password"/>
        </div>
        <div class="form-group">
          <label>Pincode</label>
          <input type="text" id="regPin" placeholder="Your area pincode"/>
        </div>
        <button class="btn-primary btn-full" onclick="handleRegister()">Create Account →</button>
        <p class="auth-switch">Already have an account? <a href="#" onclick="switchView('login')">Login</a></p>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function switchView(view) {
      document.getElementById('loginView').style.display = view === 'login' ? 'block' : 'none';
      document.getElementById('registerView').style.display = view === 'register' ? 'block' : 'none';
    }

    function showAlert(elId, type, msg) {
      const el = document.getElementById(elId);
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function handleLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (!phone || !pass) { showAlert('loginAlert', 'error', '⚠️ Please fill in all fields.'); return; }

      const users = JSON.parse(localStorage.getItem('sevaUsers') || '[]');
      const user = users.find(u => u.phone === phone && u.pass === pass);
      if (!user) { showAlert('loginAlert', 'error', '❌ Invalid credentials. Try again or register.'); return; }

      localStorage.setItem('sevaCurrentUser', JSON.stringify(user));
      showAlert('loginAlert', 'success', '✅ Logged in! Redirecting...');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }

    function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      const pin = document.getElementById('regPin').value.trim();
      if (!name || !phone || !pass || !pin) { showAlert('regAlert', 'error', '⚠️ Please fill all fields.'); return; }

      const users = JSON.parse(localStorage.getItem('sevaUsers') || '[]');
      if (users.find(u => u.phone === phone)) { showAlert('regAlert', 'error', '❌ This mobile number is already registered.'); return; }

      users.push({ name, phone, pass, pin });
      localStorage.setItem('sevaUsers', JSON.stringify(users));
      localStorage.setItem('sevaCurrentUser', JSON.stringify({ name, phone, pin }));
      showAlert('regAlert', 'success', '✅ Account created! Redirecting...');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }
  </script>
</body>
</html>
